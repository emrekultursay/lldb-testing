name: Build and test LLDB

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Runs every day at 11:00 AM PDT (7 hours behind UTC)
    # This corresponds to 18:00 UTC.
    - cron: '0 18 * * *'
  # Allows manual running from the Actions tab
  workflow_dispatch:


jobs:
  build:
    runs-on: [self-hosted, builder]

    steps:
    - uses: actions/checkout@v5
      with:
        submodules: true

    - name: Install SWIG, clang and lld
      run: |
        missing=()
        command -v swig >/dev/null || missing+=(swig)
        command -v clang >/dev/null || missing+=(clang)
        command -v ld.lld >/dev/null || missing+=(lld)
        if [[ ${#missing[@]} -gt 0 ]]; then
          sudo apt-get update && sudo apt-get install -y "${missing[@]}"
        fi
        clang --version | head -1; ld.lld --version

    # Persistent compiler cache outside the workspace (which actions/checkout
    # wipes on every run). CCACHE_BASEDIR makes hits work across runners with
    # different workspace paths; content-based compiler check is needed because
    # the NDK is re-extracted on every run.
    - name: Set up ccache
      run: |
        command -v ccache >/dev/null || (sudo apt-get update && sudo apt-get install -y ccache)
        {
          echo "CCACHE_DIR=$HOME/.cache/lldb-testing-ccache"
          echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE"
          echo "CCACHE_COMPILERCHECK=content"
          echo "CCACHE_NOHASHDIR=true"
        } >> "$GITHUB_ENV"
        export CCACHE_DIR="$HOME/.cache/lldb-testing-ccache"
        ccache --max-size=20G
        ccache --zero-stats

    - name: Download dependencies
      run: ./download_dependencies.sh

    # Build

    - name: Build LLDB for host
      run: ./build_lldb.sh

    - name: Build lldb-server for Android arm64
      run: ANDROID_ABI=arm64-v8a ./build_lldb_server.sh

    - name: Build lldb-server for Android arm32
      run: ANDROID_ABI=armeabi-v7a ./build_lldb_server.sh

    - name: ccache stats
      if: always()
      run: ccache --show-stats --verbose

    # Upload

    # Pack into a single zstd-compressed tar: upload-artifact doesn't preserve
    # symlinks (liblldb.so would be uploaded 3x), is slow with many small files,
    # and its zip compression is weaker than zstd.
    - name: Pack LLDB for host
      run: |
        command -v zstd >/dev/null || (sudo apt-get update && sudo apt-get install -y zstd)
        tar -I 'zstd -T0 -10' -cf lldb-linux-x86_64.tar.zst -C build-linux-x86_64 install
        ls -la lldb-linux-x86_64.tar.zst

    - name: Upload LLDB for host
      uses: actions/upload-artifact@v4
      with:
        name: lldb-linux-x86_64-${{ github.run_id }}
        path: lldb-linux-x86_64.tar.zst
        compression-level: 0
        if-no-files-found: 'error'

    - name: Upload lldb-server for Android arm64
      uses: actions/upload-artifact@v4
      with:
        name: lldb-server-arm64-${{ github.run_id }}
        path: build-arm64-v8a/out/bin/lldb-server
        if-no-files-found: 'error'

    - name: Upload lldb-server for Android arm32
      uses: actions/upload-artifact@v4
      with:
        name: lldb-server-arm32-${{ github.run_id }}
        path: build-armeabi-v7a/out/bin/lldb-server
        if-no-files-found: 'error'



  test:
    # This job runs after 'build' completes.
    needs: [build]

    runs-on: [self-hosted, tester]

    steps:
    - uses: actions/checkout@v5

    - name: Download dependencies
      run: ./download_dependencies.sh

    # Download

    - name: Download LLDB for host
      uses: actions/download-artifact@v4
      with:
        name: lldb-linux-x86_64-${{ github.run_id }}
        path: .

    - name: Unpack LLDB for host
      run: |
        command -v zstd >/dev/null || (sudo apt-get update && sudo apt-get install -y zstd)
        mkdir -p build-linux-x86_64
        tar -I zstd -xf lldb-linux-x86_64.tar.zst -C build-linux-x86_64
        rm lldb-linux-x86_64.tar.zst

    - name: Download lldb-server for Android arm64
      uses: actions/download-artifact@v4
      with:
        name: lldb-server-arm64-${{ github.run_id }}
        path: build-arm64-v8a/out/bin/

    - name: Download lldb-server for Android arm32
      uses: actions/download-artifact@v4
      with:
        name: lldb-server-arm32-${{ github.run_id }}
        path: build-armeabi-v7a/out/bin/

    # Test

    - name: Run tests on Android-arm64-v8a
      run: ANDROID_ABI=arm64-v8a ./test.sh

    - name: Run tests on Android-armeabi-v7a
      run: ANDROID_ABI=armeabi-v7a ./test.sh

